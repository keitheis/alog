name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            toxenv: py38
            os: ubuntu-latest
          - python-version: "3.9"
            toxenv: py39
            os: ubuntu-latest
          - python-version: "3.10"
            toxenv: py310
            os: ubuntu-latest
          - python-version: "3.11"
            toxenv: py311
            os: ubuntu-latest
          - python-version: "3.12"
            toxenv: py312
            os: ubuntu-latest
          - python-version: "3.13"
            toxenv: py313
            os: ubuntu-latest
          - python-version: "pypy-3.9"
            toxenv: pypy
            os: ubuntu-latest
          - python-version: "3.13"
            toxenv: py3-cover,coverage
            os: ubuntu-latest
            coverage: true

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Run tests with tox
      run: tox
      env:
        TOXENV: ${{ matrix.toxenv }}

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
